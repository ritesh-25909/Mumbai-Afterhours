
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <meta
      name="description"
      content="Mumbai Afterhours: real people, meaningful connections, Mumbai."
    />

    <meta name="theme-color" content="#071225" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload ImgBB brand image -->
    <link
      rel="preconnect"
      href="https://i.ibb.co"
    />

    <link
      rel="preload"
      as="image"
      href="https://i.ibb.co/WvbHwfDp/header.png"
      fetchpriority="high"
    />

    <!-- Font connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Non-blocking Google Font loading -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>Mumbai Afterhours</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
